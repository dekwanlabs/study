<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <style>
      .bg { fill: #fffdf7; }
      .panel { fill: #ffffff; stroke: #dbe4ee; stroke-width: 2; }
      .axis { stroke: #334155; stroke-width: 3; }
      .circle { fill: none; stroke: #0f766e; stroke-width: 4; }
      .green { stroke: #0f766e; stroke-width: 4.5; }
      .red { stroke: #dc2626; stroke-width: 4.5; }
      .blue { stroke: #2563eb; stroke-width: 4.5; }
      .guide { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 6; fill: none; }
      .arcA { fill: none; stroke: #7c3aed; stroke-width: 3; }
      .arcB { fill: none; stroke: #f59e0b; stroke-width: 3; }
      .arcC { fill: none; stroke: #f59e0b; stroke-width: 3; }
      .note { fill: #ffffff; stroke: #dbe4ee; stroke-width: 2; }
      .title {
        font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
        font-size: 32px;
        font-weight: 700;
        fill: #0f172a;
      }
      .panelTitle {
        font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
        font-size: 26px;
        font-weight: 700;
        fill: #0f172a;
      }
      .text {
        font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
        font-size: 22px;
        fill: #0f172a;
      }
      .math {
        font-family: "Times New Roman", "Cambria Math", "STIX Two Math", "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", serif;
        font-size: 28px;
        fill: #0f172a;
      }
      .small {
        font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
        font-size: 20px;
        fill: #475569;
      }
      .redLabel { fill: #dc2626; }
      .blueLabel { fill: #2563eb; }
      .greenLabel { fill: #0f766e; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#334155"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#0f766e"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#dc2626"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="720" rx="20"/>
  <text class="title" x="38" y="52">和角公式最通俗的看法：先拆，再一起转</text>

  <rect class="panel" x="38" y="88" width="520" height="430" rx="18"/>
  <rect class="panel" x="642" y="88" width="520" height="430" rx="18"/>
  <rect class="note" x="80" y="556" width="1040" height="110" rx="18"/>

  <!-- Left -->
  <g transform="translate(38 88)">
    <text class="panelTitle" x="28" y="38">1. 角 α 的半径先拆成两段</text>

    <line class="axis" x1="50" y1="260" x2="470" y2="260" marker-end="url(#arrow)"/>
    <line class="axis" x1="150" y1="395" x2="150" y2="48" marker-end="url(#arrow)"/>
    <circle class="circle" cx="150" cy="260" r="170"/>

    <line class="green" x1="150" y1="260" x2="310" y2="120" marker-end="url(#arrowGreen)"/>
    <path class="guide" d="M150 120 L310 120"/>
    <path class="guide" d="M310 260 L310 120"/>
    <path class="arcA" d="M214 260 A64 64 0 0 0 198 214"/>

    <circle cx="310" cy="120" r="6.5" fill="#0f766e"/>

    <g class="text">
      <text x="480" y="267">x</text>
      <text x="160" y="46">y</text>
      <text x="160" y="286">O</text>
      <text x="320" y="114">A(cos α, sin α)</text>
      <text x="214" y="212">α</text>
    </g>

    <text class="text redLabel" x="182" y="248">横段：cos α</text>
    <text class="text blueLabel" x="322" y="202">竖段：sin α</text>
  </g>

  <!-- Right -->
  <g transform="translate(642 88)">
    <text class="panelTitle" x="28" y="38">2. 再把这两段一起转 β</text>

    <line class="axis" x1="50" y1="260" x2="470" y2="260" marker-end="url(#arrow)"/>
    <line class="axis" x1="150" y1="395" x2="150" y2="48" marker-end="url(#arrow)"/>

    <line class="red" x1="150" y1="260" x2="306" y2="170" marker-end="url(#arrowRed)"/>
    <line class="blue" x1="306" y1="170" x2="243" y2="61" marker-end="url(#arrowBlue)"/>
    <line class="green" x1="150" y1="260" x2="243" y2="61" marker-end="url(#arrowGreen)"/>

    <path class="guide" d="M243 260 L243 61"/>
    <path class="guide" d="M150 61 L243 61"/>
    <path class="guide" d="M306 170 L306 60"/>
    <path class="arcB" d="M210 260 A60 60 0 0 0 202 230"/>
    <path class="arcC" d="M306 130 A40 40 0 0 1 287 136"/>

    <circle cx="306" cy="170" r="5.5" fill="#dc2626"/>
    <circle cx="243" cy="61" r="6.5" fill="#0f766e"/>

    <g class="text">
      <text x="480" y="267">x</text>
      <text x="160" y="46">y</text>
      <text x="160" y="286">O</text>
      <text x="252" y="56">B(cos(α+β), sin(α+β))</text>
      <text x="214" y="230">β</text>
      <text x="278" y="134">β</text>
      <text x="210" y="184" class="redLabel">红段：长度 cos α</text>
      <text x="324" y="116" class="blueLabel">蓝段：长度 sin α</text>
      <text x="318" y="90" class="small">先竖直，再转 β</text>
    </g>
  </g>

  <text class="text" x="110" y="594">看右图时只抓这两句：</text>
  <text class="math" x="110" y="630">横坐标 = cos α cos β - sin α sin β</text>
  <text class="math" x="110" y="660">纵坐标 = cos α sin β + sin α cos β</text>
</svg>
