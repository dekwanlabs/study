<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="760" viewBox="0 0 1150 760">
  <defs>
    <style>
      .bg { fill: #fffdf7; }
      .panel { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.6; }
      .grid { stroke: #e5e7eb; stroke-width: 1; }
      .axis { stroke: #334155; stroke-width: 3; }
      .tri-left { fill: #fde68a; fill-opacity: 0.56; stroke: #f59e0b; stroke-width: 3; }
      .tri-right { fill: #bfdbfe; fill-opacity: 0.48; stroke: #2563eb; stroke-width: 3; }
      .para-right { fill: #dbeafe; fill-opacity: 0.20; stroke: #2563eb; stroke-width: 2.4; stroke-dasharray: 10 7; }
      .shift { stroke: #dc2626; stroke-width: 4; stroke-dasharray: 10 8; fill: none; }
      .base-line { stroke: #0f766e; stroke-width: 4.5; fill: none; }
      .height-line { stroke: #dc2626; stroke-width: 4; fill: none; }
      .guide { stroke: #94a3b8; stroke-width: 2.2; stroke-dasharray: 7 6; fill: none; }
      .right-angle { fill: none; stroke: #dc2626; stroke-width: 2.4; }
      .pointA { fill: #dc2626; }
      .pointB { fill: #7c3aed; }
      .pointC { fill: #0f766e; }
      .pointD { fill: #2563eb; }
      .pointH { fill: #ea580c; }
      .title {
        font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
        font-size: 30px;
        font-weight: 700;
        fill: #0f172a;
      }
      .subtitle {
        font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
        font-size: 22px;
        font-weight: 700;
        fill: #334155;
      }
      .text {
        font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
        font-size: 18px;
        fill: #0f172a;
      }
      .small {
        font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
        font-size: 18px;
        fill: #475569;
      }
      .highlight {
        font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
        font-size: 22px;
        font-weight: 700;
      }
      .formula {
        font-family: "Times New Roman", "Cambria Math", "STIX Two Math", serif;
        font-size: 28px;
        fill: #0f172a;
      }
      .red { fill: #dc2626; }
      .blue { fill: #2563eb; }
      .purple { fill: #6d28d9; }
      .green { fill: #0f766e; }
      .amber { fill: #b45309; }
      .orange { fill: #c2410c; }
    </style>
    <marker id="arrow-axis" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#334155"/>
    </marker>
    <marker id="arrow-shift" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect class="bg" width="1150" height="760" rx="22"/>
  <text class="title" x="40" y="52">把点 A 平移到原点</text>

  <rect class="panel" x="36" y="96" width="480" height="440" rx="22"/>
  <rect class="panel" x="634" y="96" width="480" height="440" rx="22"/>
  <rect class="panel" x="318" y="84" width="514" height="82" rx="18"/>
  <rect class="panel" x="58" y="572" width="480" height="144" rx="18"/>
  <rect class="panel" x="612" y="572" width="480" height="152" rx="18"/>

  <text class="subtitle" x="70" y="136">平移前</text>
  <text class="subtitle" x="668" y="136">平移后</text>

  <g class="grid">
    <line x1="130" y1="160" x2="455" y2="160"/>
    <line x1="130" y1="225" x2="455" y2="225"/>
    <line x1="130" y1="290" x2="455" y2="290"/>
    <line x1="130" y1="355" x2="455" y2="355"/>
    <line x1="130" y1="420" x2="455" y2="420"/>
    <line x1="130" y1="485" x2="455" y2="485"/>
    <line x1="130" y1="485" x2="130" y2="140"/>
    <line x1="195" y1="485" x2="195" y2="140"/>
    <line x1="260" y1="485" x2="260" y2="140"/>
    <line x1="325" y1="485" x2="325" y2="140"/>
    <line x1="390" y1="485" x2="390" y2="140"/>
    <line x1="455" y1="485" x2="455" y2="140"/>

    <line x1="728" y1="160" x2="1053" y2="160"/>
    <line x1="728" y1="225" x2="1053" y2="225"/>
    <line x1="728" y1="290" x2="1053" y2="290"/>
    <line x1="728" y1="355" x2="1053" y2="355"/>
    <line x1="728" y1="420" x2="1053" y2="420"/>
    <line x1="728" y1="485" x2="1053" y2="485"/>
    <line x1="728" y1="485" x2="728" y2="140"/>
    <line x1="793" y1="485" x2="793" y2="140"/>
    <line x1="858" y1="485" x2="858" y2="140"/>
    <line x1="923" y1="485" x2="923" y2="140"/>
    <line x1="988" y1="485" x2="988" y2="140"/>
    <line x1="1053" y1="485" x2="1053" y2="140"/>
  </g>

  <line class="axis" x1="92" y1="485" x2="500" y2="485" marker-end="url(#arrow-axis)"/>
  <line class="axis" x1="130" y1="520" x2="130" y2="118" marker-end="url(#arrow-axis)"/>
  <line class="axis" x1="690" y1="485" x2="1098" y2="485" marker-end="url(#arrow-axis)"/>
  <line class="axis" x1="728" y1="520" x2="728" y2="118" marker-end="url(#arrow-axis)"/>

  <polygon class="tri-left" points="195,355 390,290 260,160"/>
  <line class="guide" x1="195" y1="355" x2="130" y2="485"/>
  <line class="shift" x1="195" y1="355" x2="130" y2="485" marker-end="url(#arrow-shift)"/>

  <polygon class="para-right" points="728,485 923,420 988,225 793,290"/>
  <polygon class="tri-right" points="728,485 923,420 793,290"/>
  <line class="base-line" x1="728" y1="485" x2="1062" y2="373.67"/>
  <line class="height-line" x1="793" y1="290" x2="845" y2="446"/>
  <path class="right-angle" d="M838 439 L850 435 L854 447"/>

  <circle class="pointA" cx="195" cy="355" r="8"/>
  <circle class="pointB" cx="390" cy="290" r="8"/>
  <circle class="pointC" cx="260" cy="160" r="8"/>

  <circle class="pointA" cx="728" cy="485" r="8"/>
  <circle class="pointB" cx="923" cy="420" r="8"/>
  <circle class="pointC" cx="793" cy="290" r="8"/>
  <circle class="pointD" cx="988" cy="225" r="8"/>
  <circle class="pointH" cx="845" cy="446" r="6"/>

  <g class="text">
    <text x="510" y="493">x</text>
    <text x="172" y="128">y</text>
    <text x="1108" y="493">x</text>
    <text x="770" y="128">y</text>

    <text x="122" y="501">0</text>
    <text x="188" y="510">1</text>
    <text x="253" y="510">2</text>
    <text x="318" y="510">3</text>
    <text x="383" y="510">4</text>
    <text x="448" y="510">5</text>
    <text x="117" y="491">0</text>
    <text x="117" y="426">1</text>
    <text x="117" y="361">2</text>
    <text x="117" y="296">3</text>
    <text x="117" y="231">4</text>
    <text x="117" y="166">5</text>

    <text x="720" y="501">0</text>
    <text x="786" y="510">1</text>
    <text x="851" y="510">2</text>
    <text x="916" y="510">3</text>
    <text x="981" y="510">4</text>
    <text x="1046" y="510">5</text>
    <text x="715" y="491">0</text>
    <text x="715" y="426">1</text>
    <text x="715" y="361">2</text>
    <text x="715" y="296">3</text>
    <text x="715" y="231">4</text>
    <text x="715" y="166">5</text>

    <text x="206" y="347">A(1,2)</text>
    <text x="402" y="284" class="purple">B(4,3)</text>
    <text x="278" y="148" class="green">C(2,5)</text>

    <text x="740" y="477">A'(0,0)</text>
    <text x="936" y="414" class="purple">B'(3,1)</text>
    <text x="805" y="278" class="green">C'(1,3)</text>
    <text x="1000" y="217" class="blue">D'(4,4)</text>
    <text x="857" y="456" class="orange">H</text>
  </g>

  <text class="small amber" x="346" y="118">把每个点都减去 A 的坐标 (1,2)，A 被移到原点。</text>
  <text class="small amber" x="346" y="148">图形的形状、边长、面积都不变。</text>

  <text class="highlight red" x="522" y="304">整体平移 (-1,-2)</text>
  <line class="shift" x1="538" y1="346" x2="628" y2="346" marker-end="url(#arrow-shift)"/>
  <text class="highlight red" x="146" y="396">(-1,-2)</text>

  <text class="highlight green" x="930" y="344">y = x / 3</text>
  <text class="small green" x="930" y="372">x - 3y = 0</text>
  <text class="highlight red" x="804" y="386">h = C'H</text>

  <text class="small amber" x="84" y="618">平移后，底边所在直线是 y = x / 3，也就是 x - 3y = 0。</text>
  <text class="small amber" x="84" y="652">高不是 C'B'，而是 C' 到底边的垂线 C'H。</text>
  <text class="formula" x="84" y="696">h = |1 - 3·3| / √(1² + (-3)²) = 8 / √10</text>

  <text class="small" x="638" y="618">于是平行四边形面积 = 底 × 高</text>
  <text class="formula" x="638" y="656">|AB| = √(3² + 1²) = √10</text>
  <text class="formula" x="638" y="690">|AB| · h = √10 · 8/√10 = 8</text>
  <text class="small" x="638" y="720">所以三角形面积再除以 2，就得到 S = 4。</text>
</svg>
