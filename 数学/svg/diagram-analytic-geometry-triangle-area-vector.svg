<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620">
  <defs>
    <style>
      .bg { fill: #fffdf7; }
      .panel { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.6; }
      .grid { stroke: #e5e7eb; stroke-width: 1; }
      .axis { stroke: #334155; stroke-width: 3; }
      .tri { fill: #fde68a; fill-opacity: 0.6; stroke: #f59e0b; stroke-width: 3; }
      .para { fill: #bfdbfe; fill-opacity: 0.35; stroke: #2563eb; stroke-width: 2.6; stroke-dasharray: 10 7; }
      .vectorAB { stroke: #7c3aed; stroke-width: 5; fill: none; }
      .vectorAC { stroke: #0f766e; stroke-width: 5; fill: none; }
      .helper { stroke: #94a3b8; stroke-width: 2.2; stroke-dasharray: 7 6; fill: none; }
      .pointA { fill: #dc2626; }
      .pointB { fill: #7c3aed; }
      .pointC { fill: #0f766e; }
      .pointD { fill: #2563eb; }
      .title {
        font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
        font-size: 30px;
        font-weight: 700;
        fill: #0f172a;
      }
      .text {
        font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
        font-size: 18px;
        fill: #0f172a;
      }
      .small {
        font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
        font-size: 17px;
        fill: #475569;
      }
      .highlight {
        font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
        font-size: 20px;
        font-weight: 700;
      }
      .formula {
        font-family: "Times New Roman", "Cambria Math", "STIX Two Math", serif;
        font-size: 24px;
        fill: #0f172a;
      }
      .purple { fill: #6d28d9; }
      .green { fill: #0f766e; }
      .blue { fill: #2563eb; }
      .amber { fill: #b45309; }
    </style>
    <marker id="arrow-axis" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#334155"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect class="bg" width="1180" height="620" rx="22"/>
  <text class="title" x="42" y="52">用向量看三角形面积</text>

  <rect class="panel" x="34" y="82" width="700" height="500" rx="20"/>
  <rect class="panel" x="770" y="108" width="370" height="420" rx="20"/>

  <g class="grid">
    <line x1="110" y1="140" x2="600" y2="140"/>
    <line x1="110" y1="210" x2="600" y2="210"/>
    <line x1="110" y1="280" x2="600" y2="280"/>
    <line x1="110" y1="350" x2="600" y2="350"/>
    <line x1="110" y1="420" x2="600" y2="420"/>
    <line x1="110" y1="490" x2="600" y2="490"/>
    <line x1="110" y1="560" x2="600" y2="560"/>
    <line x1="110" y1="560" x2="110" y2="120"/>
    <line x1="180" y1="560" x2="180" y2="120"/>
    <line x1="250" y1="560" x2="250" y2="120"/>
    <line x1="320" y1="560" x2="320" y2="120"/>
    <line x1="390" y1="560" x2="390" y2="120"/>
    <line x1="460" y1="560" x2="460" y2="120"/>
    <line x1="530" y1="560" x2="530" y2="120"/>
    <line x1="600" y1="560" x2="600" y2="120"/>
  </g>

  <line class="axis" x1="74" y1="560" x2="642" y2="560" marker-end="url(#arrow-axis)"/>
  <line class="axis" x1="110" y1="588" x2="110" y2="96" marker-end="url(#arrow-axis)"/>

  <polygon class="para" points="180,420 390,350 460,210 250,280"/>
  <polygon class="tri" points="180,420 390,350 250,210"/>

  <line class="vectorAB" x1="180" y1="420" x2="390" y2="350" marker-end="url(#arrow-purple)"/>
  <line class="vectorAC" x1="180" y1="420" x2="250" y2="210" marker-end="url(#arrow-green)"/>
  <line class="helper" x1="390" y1="350" x2="460" y2="140"/>
  <line class="helper" x1="250" y1="210" x2="460" y2="140"/>

  <circle class="pointA" cx="180" cy="420" r="8"/>
  <circle class="pointB" cx="390" cy="350" r="8"/>
  <circle class="pointC" cx="250" cy="210" r="8"/>
  <circle class="pointD" cx="460" cy="140" r="8"/>

  <g class="text">
    <text x="654" y="568">x</text>
    <text x="126" y="98">y</text>
    <text x="103" y="586">0</text>
    <text x="174" y="592">1</text>
    <text x="244" y="592">2</text>
    <text x="314" y="592">3</text>
    <text x="384" y="592">4</text>
    <text x="454" y="592">5</text>
    <text x="524" y="592">6</text>
    <text x="594" y="592">7</text>
    <text x="92" y="566">0</text>
    <text x="92" y="496">1</text>
    <text x="92" y="426">2</text>
    <text x="92" y="356">3</text>
    <text x="92" y="286">4</text>
    <text x="92" y="216">5</text>
    <text x="92" y="146">6</text>

    <text x="192" y="410">A(1,2)</text>
    <text x="402" y="344" class="purple">B(4,3)</text>
    <text x="262" y="202" class="green">C(2,5)</text>
    <text x="472" y="134" class="blue">D</text>

    <text x="305" y="394" class="purple highlight">AB = (3,1)</text>
    <text x="170" y="184" class="green highlight">AC = (1,3)</text>
  </g>

  <text class="highlight amber" x="810" y="156">看图顺序</text>
  <text class="small" x="810" y="202">1. 从同一个起点 A 出发，</text>
  <text class="small" x="810" y="232">画出两条向量：</text>
  <text class="small purple" x="840" y="272">AB = (4-1, 3-2) = (3,1)</text>
  <text class="small green" x="840" y="312">AC = (2-1, 5-2) = (1,3)</text>

  <text class="small" x="810" y="368">2. 把这两条向量补成</text>
  <text class="small" x="810" y="398">平行四边形 ABCD</text>
  <text class="small blue" x="810" y="442">蓝色虚线框出的面积</text>
  <text class="small blue" x="810" y="472">就是平行四边形面积</text>
  <text class="small amber" x="810" y="512">黄色部分面积就是</text>
  <text class="small amber" x="810" y="542">三角形 ABC 的面积</text>

  <text class="formula" x="810" y="586">S = 1/2 |3·3 - 1·1| = 4</text>
</svg>
