<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560">
  <defs>
    <style>
      .bg { fill: #fffdf7; }
      .panel { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.6; }
      .grid { stroke: #e5e7eb; stroke-width: 1; }
      .axis { stroke: #334155; stroke-width: 3; }
      .bigRect { fill: #fde68a; fill-opacity: 0.35; stroke: #f59e0b; stroke-width: 2.6; }
      .smallRect { fill: #bfdbfe; fill-opacity: 0.48; stroke: #2563eb; stroke-width: 2.6; }
      .para { fill: #86efac; fill-opacity: 0.42; stroke: #16a34a; stroke-width: 3; }
      .vecAB { stroke: #7c3aed; stroke-width: 4.5; fill: none; }
      .vecAC { stroke: #0f766e; stroke-width: 4.5; fill: none; }
      .helper { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 6; fill: none; }
      .pointO { fill: #dc2626; }
      .pointB { fill: #7c3aed; }
      .pointC { fill: #0f766e; }
      .pointD { fill: #16a34a; }
      .title {
        font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
        font-size: 28px;
        font-weight: 700;
        fill: #0f172a;
      }
      .text {
        font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
        font-size: 18px;
        fill: #0f172a;
      }
      .small {
        font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
        font-size: 17px;
        fill: #475569;
      }
      .highlight {
        font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
        font-size: 20px;
        font-weight: 700;
      }
      .formula {
        font-family: "Times New Roman", "Cambria Math", "STIX Two Math", serif;
        font-size: 28px;
        fill: #0f172a;
      }
      .amber { fill: #b45309; }
      .purple { fill: #6d28d9; }
      .green { fill: #0f766e; }
      .blue { fill: #2563eb; }
      .leaf { fill: #15803d; }
    </style>
    <marker id="arrow-axis" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#334155"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect class="bg" width="1120" height="560" rx="20"/>
  <text class="title" x="36" y="44">为什么会出现 3×3 - 1×1</text>

  <rect class="panel" x="30" y="74" width="660" height="450" rx="20"/>
  <rect class="panel" x="726" y="98" width="350" height="372" rx="18"/>

  <g class="grid">
    <line x1="100" y1="130" x2="490" y2="130"/>
    <line x1="100" y1="200" x2="490" y2="200"/>
    <line x1="100" y1="270" x2="490" y2="270"/>
    <line x1="100" y1="340" x2="490" y2="340"/>
    <line x1="100" y1="410" x2="490" y2="410"/>
    <line x1="100" y1="480" x2="490" y2="480"/>
    <line x1="100" y1="480" x2="100" y2="100"/>
    <line x1="170" y1="480" x2="170" y2="100"/>
    <line x1="240" y1="480" x2="240" y2="100"/>
    <line x1="310" y1="480" x2="310" y2="100"/>
    <line x1="380" y1="480" x2="380" y2="100"/>
    <line x1="450" y1="480" x2="450" y2="100"/>
  </g>

  <line class="axis" x1="66" y1="480" x2="530" y2="480" marker-end="url(#arrow-axis)"/>
  <line class="axis" x1="100" y1="510" x2="100" y2="72" marker-end="url(#arrow-axis)"/>

  <rect class="bigRect" x="100" y="270" width="210" height="210"/>
  <rect class="smallRect" x="100" y="410" width="70" height="70"/>
  <polygon class="para" points="100,480 310,410 380,200 170,270"/>

  <line class="vecAB" x1="100" y1="480" x2="310" y2="410" marker-end="url(#arrow-purple)"/>
  <line class="vecAC" x1="100" y1="480" x2="170" y2="270" marker-end="url(#arrow-green)"/>
  <line class="helper" x1="310" y1="410" x2="380" y2="200"/>
  <line class="helper" x1="170" y1="270" x2="380" y2="200"/>
  <line class="helper" x1="310" y1="480" x2="310" y2="270"/>
  <line class="helper" x1="170" y1="480" x2="170" y2="410"/>

  <circle class="pointO" cx="100" cy="480" r="8"/>
  <circle class="pointB" cx="310" cy="410" r="8"/>
  <circle class="pointC" cx="170" cy="270" r="8"/>
  <circle class="pointD" cx="380" cy="200" r="8"/>

  <g class="text">
    <text x="540" y="488">x</text>
    <text x="116" y="72">y</text>

    <text x="92" y="498">0</text>
    <text x="164" y="506">1</text>
    <text x="234" y="506">2</text>
    <text x="304" y="506">3</text>
    <text x="374" y="506">4</text>
    <text x="444" y="506">5</text>
    <text x="88" y="486">0</text>
    <text x="88" y="416">1</text>
    <text x="88" y="346">2</text>
    <text x="88" y="276">3</text>
    <text x="88" y="206">4</text>
    <text x="88" y="136">5</text>

    <text x="112" y="472">A'(0,0)</text>
    <text x="322" y="404" class="purple">B'(3,1)</text>
    <text x="182" y="262" class="green">C'(1,3)</text>
    <text x="392" y="192" class="leaf">D'(4,4)</text>

    <text x="176" y="468" class="highlight amber">1</text>
    <text x="316" y="468" class="highlight amber">3</text>
    <text x="72" y="458" class="highlight purple">1</text>
    <text x="72" y="298" class="highlight green">3</text>

    <text x="176" y="384" class="highlight amber">小矩形：1 × 1</text>
    <text x="154" y="334" class="highlight amber">大矩形：3 × 3</text>
    <text x="186" y="376" class="highlight leaf">绿色平行四边形面积</text>
  </g>

  <text class="highlight amber" x="754" y="142">看图顺序</text>
  <text class="small" x="754" y="184">1. 向量 AB = (3,1)</text>
  <text class="small" x="784" y="214">横向走 3，纵向走 1</text>
  <text class="small" x="754" y="252">2. 向量 AC = (1,3)</text>
  <text class="small" x="784" y="282">横向走 1，纵向走 3</text>
  <text class="small" x="754" y="324">3. 用 AB 的横向 3</text>
  <text class="small" x="784" y="354">乘 AC 的纵向 3，得到 3×3</text>
  <text class="small" x="754" y="392">4. 用 AC 的横向 1</text>
  <text class="small" x="784" y="422">乘 AB 的纵向 1，得到 1×1</text>
  <text class="formula" x="754" y="468">3·3 - 1·1 = 8</text>
  <text class="small" x="754" y="502">这个 8 正好等于</text>
  <text class="small" x="754" y="528">两个向量围成的平行四边形面积</text>
</svg>
